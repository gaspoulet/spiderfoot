<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Bureau</title>
  <meta name="description" content="Dashboard de bureau : heure de Hong Kong, réveil, emploi du temps et devoirs.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bureau">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Icônes façon SF Symbols -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-alarm" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 9v4.2l2.6 1.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.8 6.6 6.9 3.8M20.2 6.6 17.1 3.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M3.5 10h17" stroke="currentColor" stroke-width="2.1"/><path d="M8 3v4M16 3v4" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><circle cx="8.5" cy="14.5" r="1.3" fill="currentColor"/><circle cx="12" cy="14.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="14.5" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><circle cx="5" cy="6.5" r="1.7" fill="currentColor"/><circle cx="5" cy="12" r="1.7" fill="currentColor"/><circle cx="5" cy="17.5" r="1.7" fill="currentColor"/><path d="M9.5 6.5H20M9.5 12H20M9.5 17.5H20" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.2-3.8-8.5s1.2-6.1 3.8-8.5z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m13.5 6.5 4 4" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-speaker-off" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="m15.5 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 1.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m6.5 12.5 3.6 3.6 7.4-8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M19 12a7 7 0 0 1-12.2 4.7M5 12a7 7 0 0 1 12.2-4.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17.5 3.5v4h-4M6.5 20.5v-4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </svg>

  <div class="bg" aria-hidden="true"></div>

  <main id="app" class="app">
    <!-- Colonne 1 : horloge + Paris + réveil -->
    <section class="col col-clock">
      <div class="clock" id="clock">
        <div class="clock-time" id="hk-hm" aria-live="off"></div>
        <div class="clock-date" id="hk-date">—</div>
      </div>

      <div class="pill-row">
        <div class="paris-pill" id="paris">
          <svg class="sym" style="color:var(--blue)"><use href="#i-globe"/></svg>
          <span class="paris-label">Paris</span>
          <span class="paris-time" id="paris-time">--:--</span>
        </div>
        <button class="standby-btn" id="standby-btn" aria-label="Afficher seulement l'heure"><svg><use href="#i-clock"/></svg></button>
      </div>

      <article class="widget alarm-widget" id="alarm-widget">
        <header class="w-head">
          <span class="w-icon" style="--tint:var(--orange)"><svg><use href="#i-alarm"/></svg></span>
          <span class="w-title">Réveil</span>
          <button class="sound-ind" id="arm-btn" aria-label="Son du réveil"><svg><use href="#i-speaker-off"/></svg></button>
        </header>
        <div class="alarm-row">
          <button class="alarm-time" id="alarm-time-btn"><span id="alarm-time">07:00</span><small id="alarm-days">Tous les jours</small></button>
          <label class="ios-switch"><input type="checkbox" id="alarm-enabled"><span></span></label>
        </div>
      </article>
    </section>

    <!-- Colonne 2 : emploi du temps -->
    <section class="col">
      <article class="widget cal-widget" id="cal-widget">
        <header class="w-head">
          <span class="w-icon" style="--tint:var(--red)"><svg><use href="#i-calendar"/></svg></span>
          <span class="w-title" id="cal-title">Aujourd'hui</span>
        </header>
        <div class="next-line" id="next-line"></div>
        <ol class="cal-list" id="cal-list"></ol>
      </article>
    </section>

    <!-- Colonne 3 : devoirs -->
    <section class="col">
      <article class="widget rem-widget" id="rem-widget">
        <header class="w-head">
          <span class="w-icon" style="--tint:var(--blue)"><svg><use href="#i-list"/></svg></span>
          <span class="w-title">Devoirs</span>
          <span class="w-count" id="hw-count"></span>
          <button class="w-action" id="hw-add" aria-label="Ajouter un devoir"><svg><use href="#i-plus"/></svg></button>
        </header>
        <ul class="rem-list" id="hw-list"></ul>
        <footer class="sync-line" id="sync-line"><svg><use href="#i-sync"/></svg><span id="sync-text">—</span></footer>
      </article>
    </section>
  </main>

  <!-- Écran de sonnerie -->
  <div class="ring" id="ring" hidden>
    <div class="ring-inner">
      <div class="ring-icon"><svg><use href="#i-alarm"/></svg></div>
      <div class="ring-time" id="ring-time">07:00</div>
      <div class="ring-label" id="ring-label">Réveil</div>
      <div class="ring-actions">
        <button class="ring-btn snooze" id="ring-snooze">+5 min</button>
        <button class="ring-btn stop" id="ring-stop">Stop</button>
      </div>
    </div>
  </div>

  <!-- Feuille iOS générique -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grabber"></div>
    <header class="sheet-head">
      <button class="sheet-btn" id="sheet-cancel">Annuler</button>
      <h2 id="sheet-title">—</h2>
      <button class="sheet-btn strong" id="sheet-ok">OK</button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div class="toast" id="toast"><span id="toast-text"></span><button id="toast-undo">Annuler</button></div>

  <script src="/app.js" defer></script>
</body>
</html>
