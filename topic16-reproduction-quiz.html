<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topic 16 Reproduction Quiz</title>
<meta name="description" content="Interactive revision quiz for Cambridge IGCSE Biology (0610) Topic 16: Reproduction – Extended.">
<style>
:root{
  --bg:#f5f7fb;--card:#ffffff;--ink:#1c2333;--muted:#5d6678;--line:#d8deea;--soft:#eef2fa;
  --accent:#3563d9;--accent-soft:#9fb5ee;--accent-bg:#e8eefc;
  --ok:#17914c;--ok-bg:#e2f5ea;--bad:#d03f3f;--bad-bg:#fde7e7;--warn:#c98200;--warn-bg:#fff2d4;
  --amber:#e6a100;--red:#d64545;--green:#20a35a;
  --d-stroke:#2a3346;--d-stem:#6db35a;--d-sepal:#86c56f;--d-petal:#f5a3c0;--d-nectary:#f39c3d;
  --d-filament:#d8c58e;--d-anther:#f2c230;--d-style:#a9d886;--d-stigma:#e3cd52;--d-ovary:#9fd287;--d-cav:#d6efc7;--d-ovule:#fff0a6;
  --d-organ:#f6c3b4;--d-organ2:#f0a99a;--d-bladder:#fbe7a8;--d-duct:#7aa7e0;--d-gland:#c7b2ec;--d-tube:#e98c8c;--d-cav2:#fde1da;
  --d-sperm:#9ec3f0;--d-egg:#fbe0c3;--d-jelly:#e6f1ff;--d-nucleus:#7a5bbf;--d-mito:#f08f3a;--d-yolk:#f2c46b;
  --c-fsh:#8b5cf6;--c-lh:#ea580c;--c-oes:#2563eb;--c-pro:#15924c;--c-lining:#f08aa0;
  --m-blood:#f3b6b6;--f-blood:#b9d3f5;--soil:#a07850;--pot:#c9734a;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151d;--card:#1a202b;--ink:#e7ebf3;--muted:#a1aabb;--line:#2e3646;--soft:#232a37;
  --accent:#7b9dff;--accent-soft:#4a62a8;--accent-bg:#222d48;
  --ok:#4ccb7f;--ok-bg:#183527;--bad:#ff7b7b;--bad-bg:#3c1f22;--warn:#f0b93d;--warn-bg:#3a2f15;
  --d-stroke:#cfd6e4;--d-stem:#4f8f40;--d-sepal:#5f9e4c;--d-petal:#c4668c;--d-nectary:#d0802c;
  --d-filament:#a8976a;--d-anther:#d1a51c;--d-style:#78ab5a;--d-stigma:#b9a43a;--d-ovary:#6fa65a;--d-cav:#36522c;--d-ovule:#c9b85c;
  --d-organ:#b9786a;--d-organ2:#a35f52;--d-bladder:#a48f45;--d-duct:#4f7fc0;--d-gland:#8a74b8;--d-tube:#c25f5f;--d-cav2:#5c3a35;
  --d-sperm:#5c86bd;--d-egg:#9c7f60;--d-jelly:#27364d;--d-nucleus:#9c80e0;--d-mito:#d07028;--d-yolk:#c29a3a;
  --c-fsh:#a98bff;--c-lh:#ff8a4c;--c-oes:#6aa0ff;--c-pro:#48c27a;--c-lining:#e0718a;
  --m-blood:#6e3434;--f-blood:#2f4a6e;--soil:#6d5136;--pot:#9a5434;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11151d;--card:#1a202b;--ink:#e7ebf3;--muted:#a1aabb;--line:#2e3646;--soft:#232a37;
  --accent:#7b9dff;--accent-soft:#4a62a8;--accent-bg:#222d48;
  --ok:#4ccb7f;--ok-bg:#183527;--bad:#ff7b7b;--bad-bg:#3c1f22;--warn:#f0b93d;--warn-bg:#3a2f15;
  --d-stroke:#cfd6e4;--d-stem:#4f8f40;--d-sepal:#5f9e4c;--d-petal:#c4668c;--d-nectary:#d0802c;
  --d-filament:#a8976a;--d-anther:#d1a51c;--d-style:#78ab5a;--d-stigma:#b9a43a;--d-ovary:#6fa65a;--d-cav:#36522c;--d-ovule:#c9b85c;
  --d-organ:#b9786a;--d-organ2:#a35f52;--d-bladder:#a48f45;--d-duct:#4f7fc0;--d-gland:#8a74b8;--d-tube:#c25f5f;--d-cav2:#5c3a35;
  --d-sperm:#5c86bd;--d-egg:#9c7f60;--d-jelly:#27364d;--d-nucleus:#9c80e0;--d-mito:#d07028;--d-yolk:#c29a3a;
  --c-fsh:#a98bff;--c-lh:#ff8a4c;--c-oes:#6aa0ff;--c-pro:#48c27a;--c-lining:#e0718a;
  --m-blood:#6e3434;--f-blood:#2f4a6e;--soil:#6d5136;--pot:#9a5434;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
button{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;cursor:pointer;background:none;border:0;padding:0}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px}
.top-actions{display:flex;gap:6px}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:40px;height:38px;cursor:pointer;padding:0 10px;font-size:14px}
main{max-width:880px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:clamp(22px,5vw,30px);line-height:1.2;margin:8px 0 4px}
h2{font-size:clamp(18px,4.2vw,22px);line-height:1.25;margin:0 0 6px}
h3{font-size:16px;margin:0 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}.small{font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:11px;font-weight:600;cursor:pointer;min-height:42px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn.sm{min-height:34px;padding:5px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* home */
.hero{margin-bottom:14px}
.sec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.sec-card{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .1s}
.sec-card:hover{border-color:var(--accent)}
.sec-card .num{font-size:13px;font-weight:700;color:var(--accent)}
.sec-card .name{font-weight:700;font-size:17px}
.sec-card .meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;margin-top:auto}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--soft)}
.badge.g{background:var(--ok-bg);color:var(--ok)}.badge.a{background:var(--warn-bg);color:var(--warn)}.badge.r{background:var(--bad-bg);color:var(--bad)}
.full-card{background:linear-gradient(135deg,var(--accent-bg),var(--card))}
.conf-panel{margin-top:14px;animation:pop .25s}
.conf-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.conf-opts button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 6px;cursor:pointer;font-weight:600;font-size:14px}
.conf-opts button:hover{border-color:var(--accent)}
.conf-opts .dot{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 6px}
.resume{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;border-color:var(--accent-soft)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;flex-wrap:wrap}
.pbar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:14px}
.pbar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-bg);color:var(--accent)}
.qcard{animation:pop .25s}
.qprompt{color:var(--muted);margin:2px 0 12px}
.qbody{margin:6px 0}
.actions{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.act-mid{display:flex;gap:8px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.hint{background:var(--warn-bg);border-left:4px solid var(--warn);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:14.5px;animation:pop .2s}
.feedback{display:none;margin-top:12px;padding:12px 14px;border-radius:10px;font-size:15px}
.feedback.show{display:block;animation:pop .3s}
.feedback.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.feedback.part{background:var(--warn-bg);border-left:4px solid var(--warn)}
.feedback.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.feedback.info{background:var(--soft);border-left:4px solid var(--accent)}
.feedback .big{font-weight:800;font-size:16px}
.model{margin-top:8px;padding:9px 11px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:14.5px}
.kwrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kw{font-size:13px;padding:3px 9px;border-radius:99px;font-weight:600}
.kw.ok{background:var(--ok);color:#fff}.kw.miss{background:var(--card);color:var(--bad);border:1px solid var(--bad)}
.ta{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--card);color:var(--ink);resize:vertical}
.ta:focus{outline:none;border-color:var(--accent)}
.checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:6px 0 10px}
.ck{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;transition:all .3s}
.ck .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;color:#fff}
.ck.on{border-color:var(--ok);background:var(--ok-bg);animation:pulse .5s}
.ck.on .box{background:var(--ok);border-color:var(--ok)}.ck.on .box::after{content:'✓'}
.ck.off{border-color:var(--bad);opacity:.85}.ck.off .box{border-color:var(--bad)}
/* drag & drop */
.tok{display:inline-flex;align-items:center;gap:4px;padding:7px 11px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 1px 0 var(--line);font-size:14px;line-height:1.25;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:border-color .15s,background .15s}
.tok:hover{border-color:var(--accent-soft)}
.tok.sel{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.tok.dragging{opacity:.3}
.tok.ok{background:var(--ok-bg);border-color:var(--ok)}
.tok.bad{background:var(--bad-bg);border-color:var(--bad)}
.tok.locked{cursor:default}
.tok .fix{font-size:12px;color:var(--bad);font-weight:700}
.dnd-ghost{position:fixed!important;left:0;top:0;margin:0!important;pointer-events:none;z-index:1000;box-shadow:0 10px 24px rgba(0,0,0,.25)!important;opacity:.96;transition:none!important}
[data-zone].over{outline:3px dashed var(--accent);outline-offset:2px;background:var(--accent-bg)!important}
.selecting [data-zone]:not(.pool){box-shadow:0 0 0 2px var(--accent-soft) inset}
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:10px;min-height:54px;border:1.5px dashed var(--line);border-radius:12px;margin-top:12px;background:var(--soft);align-items:flex-start}
.pool:empty::after{content:'All cards placed – press Check';color:var(--muted);font-size:13.5px;margin:auto}
.locked .tok{cursor:default}
.pool-label{font-size:12.5px;color:var(--muted);margin:10px 0 -6px;font-weight:600}
/* sort */
.sgrid{display:grid;gap:8px;align-items:stretch}
.gh{font-weight:700;font-size:13.5px;padding:6px 8px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--soft);border-radius:8px}
.gh.rowh{justify-content:flex-start;text-align:left}
.gh.corner{background:transparent}
.szone{min-height:84px;border:1.5px dashed var(--accent-soft);border-radius:12px;padding:6px;background:var(--card);transition:background .15s}
.szone .zb{display:flex;flex-direction:column;gap:6px;min-height:60px}
.szone .zh{font-weight:800;text-align:center;padding:4px 0 8px;font-size:15px}
.szone .tok{width:100%;font-size:13.5px}
.scols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scols.vs{position:relative}
.scols.vs::after{content:'VS';position:absolute;left:50%;top:-4px;transform:translateX(-50%);background:var(--accent);color:#fff;font-weight:900;border-radius:99px;padding:4px 10px;font-size:13px}
.scols.three{grid-template-columns:repeat(3,1fr)}
/* grid table */
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gtable{display:grid;gap:6px;min-width:300px}
.gc{display:flex;align-items:center;justify-content:center;border-radius:10px;padding:3px;transition:background .2s}
.gc.ok{background:var(--ok-bg)}.gc.bad{background:var(--bad-bg)}
.cyc{width:100%;min-height:46px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-weight:800;font-size:16px;cursor:pointer;color:var(--muted)}
.cyc.set{color:var(--ink);border-color:var(--accent-soft)}
.cyc:disabled{cursor:default}
.segw{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;width:100%}
.segb{flex:1;border:0;background:var(--card);padding:9px 4px;cursor:pointer;font-weight:600;font-size:14px}
.segb+.segb{border-left:1.5px solid var(--line)}
.segb.on{background:var(--accent);color:#fff}
.segw.locked .segb{cursor:default}
.segb.should{box-shadow:inset 0 0 0 3px var(--ok)}
s{opacity:.6}
/* boards */
.board{position:relative;max-width:540px;margin:0 auto;user-select:none;-webkit-user-select:none}
.board>svg{width:100%;height:auto;display:block;overflow:visible}
.hot{position:absolute;transform:translate(-50%,-50%);width:clamp(66px,22.5%,124px);min-height:30px;border:2px dashed var(--accent-soft);border-radius:9px;background:var(--card);display:flex;align-items:center;justify-content:center;z-index:2;transition:background .15s}
.hot .tok{width:100%;justify-content:center;padding:4px 3px;font-size:12.5px;text-align:center;border-radius:7px}
.hot.ok{border-color:var(--ok);border-style:solid}.hot.bad{border-color:var(--bad);border-style:solid}
.hot.round{border-radius:50%;width:13%;aspect-ratio:1;min-height:0;background:transparent}
.dg text{fill:var(--ink);font-family:system-ui,sans-serif}
.dg .lbl{font-size:13px;font-weight:600}
.leader{stroke:var(--d-stroke);stroke-width:1.2;fill:none}
.leader-dot{fill:var(--d-stroke)}
.ink{stroke:var(--d-stroke);stroke-width:1.6;stroke-linejoin:round}
.part{cursor:pointer;transition:filter .15s,opacity .4s}
.clickable .part:hover{filter:brightness(1.12) drop-shadow(0 0 3px var(--accent))}
.part.good{animation:goodflash .7s}
.part.wrong{animation:badflash .6s}
.part.pulse{animation:pulsepart 1s infinite}
.part.dim{opacity:.35}
.hit{stroke:transparent!important;fill:none!important;stroke-width:16!important}
.f-stem{fill:var(--d-stem)}.f-sepal path{fill:var(--d-sepal)}.f-petal path{fill:var(--d-petal)}.f-nectary ellipse{fill:var(--d-nectary)}
.f-filament .fil{stroke:var(--d-filament);stroke-width:4.5;fill:none;stroke-linecap:round}
.f-anther ellipse{fill:var(--d-anther)}.f-style path{fill:var(--d-style)}.f-stigma path{fill:var(--d-stigma)}
.f-ovary>ellipse{fill:var(--d-ovary)}.f-ovary .cav{fill:var(--d-cav)}.f-ovule ellipse{fill:var(--d-ovule)}
.dg .ol{stroke:var(--d-stroke);stroke-width:1.5}
.info{min-height:44px;margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--soft);font-size:14.5px}
.info:empty{display:none}
.prompt-pill{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--accent-bg);font-weight:700;margin-bottom:10px;font-size:15.5px;animation:pop .25s}
.prompt-pill .pnum{background:var(--accent);color:#fff;border-radius:99px;padding:2px 9px;font-size:12.5px;flex:none}
.modes{display:flex;gap:6px;margin-bottom:10px}
/* wires */
.wires{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(30px,10vw,90px);row-gap:0}
.wcol{display:flex;flex-direction:column;gap:7px;position:relative;z-index:1}
.witem{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13.5px;text-align:left;line-height:1.25;min-height:40px;position:relative;transition:border-color .15s,background .15s}
.wcol.r .witem{text-align:left}
.witem.sel{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 2px var(--accent)}
.witem.linked{border-color:var(--accent-soft)}
.witem.ok{border-color:var(--ok);background:var(--ok-bg)}.witem.bad{border-color:var(--bad);background:var(--bad-bg)}
.witem .corr{display:block;font-size:12px;color:var(--ok);font-weight:700;margin-top:3px}
.wcol.l .witem{font-weight:700}
.ovl{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.ovl path{fill:none;stroke-width:3;stroke-linecap:round}
/* order */
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--accent-soft);border-radius:12px;padding:5px;min-height:46px;background:var(--card)}
.slot .num{width:28px;height:28px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-weight:800;display:grid;place-items:center;flex:none;font-size:14px}
.slot .zb{flex:1;min-height:34px;display:flex}
.slot .tok{width:100%}
.slot.ok{border-color:var(--ok);border-style:solid}.slot.bad{border-color:var(--bad);border-style:solid}
.slot.playing{background:var(--accent-bg);border-color:var(--accent);border-style:solid}
.stage{margin-top:14px;animation:pop .3s}
.caption{text-align:center;font-weight:700;min-height:26px;margin-top:6px;color:var(--accent)}
/* mindmap */
.mm{position:relative}
.mm-center{position:relative;z-index:1;margin:0 auto 34px;width:max-content;max-width:90%;padding:12px 22px;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;font-size:17px;text-align:center}
.mm-branches{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mm .szone{border-radius:16px}
.mm .szone .zh{border-radius:10px;background:var(--soft)}
/* dkey */
.dk-ex{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--accent-bg);margin-bottom:12px;animation:pop .25s}
.dk-ex .ico{width:52px;height:52px;flex:none}
.dk-ex b{font-size:17px}
.dk-key{display:flex;flex-direction:column;gap:8px}
.dk-node{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;opacity:.5;transition:all .25s}
.dk-node.active{opacity:1;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.dk-node.passed{opacity:.9}
.dk-node .q{font-weight:700}
.dk-node .opts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.dk-node .opts .btn{min-width:110px}
.dk-node .lead{font-size:13px;color:var(--muted)}
.dk-res{margin-top:10px;padding:10px 12px;border-radius:12px;font-weight:700;animation:pop .25s}
.dk-res.ok{background:var(--ok-bg);color:var(--ok)}.dk-res.bad{background:var(--bad-bg);color:var(--bad)}
.dk-dots{display:flex;gap:5px;margin-bottom:8px}
.dk-dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dk-dots i.ok{background:var(--ok)}.dk-dots i.bad{background:var(--bad)}.dk-dots i.cur{background:var(--accent)}
.chosen.btn{background:var(--accent);color:#fff}
.btn.right{background:var(--ok);color:#fff;border-color:transparent}
.btn.wrongc{background:var(--bad);color:#fff;border-color:transparent}
/* build flower */
.bf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bf-card{border:2px dashed var(--accent-soft);border-radius:14px;padding:8px;background:var(--card);display:flex;flex-direction:column;align-items:stretch}
.bf-card h3{text-align:center;margin:2px 0}
.bf-card svg{width:100%;height:auto;max-height:250px}
.bf-card .zb{display:flex;flex-direction:column;gap:5px}
.bf-card .tok{font-size:12.5px;padding:5px 8px;width:100%}
/* germ lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:center}
.switches{display:flex;flex-direction:column;gap:8px}
.sw{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font-weight:700;text-align:left}
.sw .tg{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw .tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on{border-color:var(--accent)}.sw.on .tg{background:var(--accent)}.sw.on .tg::after{left:21px}
.sw .ic{font-size:20px;width:24px;text-align:center}
.sw:disabled{cursor:default}
.lab svg{width:100%;height:auto}
.reasons{display:flex;flex-direction:column;gap:10px;margin-top:14px;animation:pop .3s}
.reason{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center}
.reason select{width:100%;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.reason.ok select{border-color:var(--ok);background:var(--ok-bg)}.reason.bad select{border-color:var(--bad);background:var(--bad-bg)}
.reason .fix{grid-column:2;font-size:13px;color:var(--ok);font-weight:600}
/* cells */
.cells{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;align-items:center}
.cells figure{margin:0;text-align:center}
.cells figcaption{font-weight:700;font-size:14px}
.cells svg{width:100%;height:auto}
.choices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.choices .btn{text-align:left;font-weight:500;font-size:14px}
.ans-list{display:grid;gap:5px;margin-top:10px;font-size:14px}
.ans-list div{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:6px 9px;border-radius:9px;background:var(--soft)}
.ans-list div.ok{background:var(--ok-bg)}.ans-list div.bad{background:var(--bad-bg)}
/* placenta */
.plac{border-radius:16px;overflow:hidden;border:1.5px solid var(--line)}
.band{padding:10px;text-align:center;font-weight:800;font-size:14.5px}
.band.mom{background:var(--m-blood)}.band.fet{background:var(--f-blood)}
.villi{display:block;width:100%;height:26px;background:var(--m-blood)}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--card)}
.lane{position:relative;min-height:190px;padding:8px 8px 8px 44px;border-radius:0!important;border:0!important;background:transparent}
.lane+.lane{border-left:1.5px dashed var(--line)!important}
.lane .zh{font-weight:800;font-size:14px;margin-bottom:6px}
.lane .zb{display:flex;flex-direction:column;gap:6px}
.lane .tok{font-size:13.5px}
.flow{position:absolute;left:12px;top:8px;bottom:8px;width:20px;border-radius:99px;overflow:hidden;background:var(--soft)}
.flow::before{content:'';position:absolute;left:0;right:0;top:-40px;bottom:-40px;background:repeating-linear-gradient(180deg,transparent 0 12px,var(--accent-soft) 12px 20px);animation:flowdown 1.2s linear infinite}
.lane.up .flow::before{animation-name:flowup}
.flow::after{content:'▼';position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:12px;color:var(--accent)}
.lane.up .flow::after{content:'▲';top:2px;bottom:auto}
.particle{position:absolute;left:46px;padding:2px 8px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;pointer-events:none;z-index:3;white-space:nowrap}
/* cycle */
.cyc-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:13.5px;font-weight:700;margin-bottom:4px}
.cyc-legend span{display:inline-flex;gap:5px;align-items:center}
.cyc-legend i{width:18px;height:4px;border-radius:2px;display:inline-block}
.cyc-svg{width:100%;height:auto;display:block;touch-action:manipulation}
.daycol{fill:transparent;cursor:pointer}
.cyc-svg path:not(.curvehit),.cyc-svg line,.cyc-svg text{pointer-events:none}
.daymode .daycol:hover{fill:var(--accent-bg)}
.curve{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .15s}
.curvehit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer}
.curvemode .curvehit:hover+.curve,.curve.hov{stroke-width:6}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.steps span{font-size:12.5px;padding:3px 9px;border-radius:99px;background:var(--soft);font-weight:600}
.steps span.cur{background:var(--accent);color:#fff}.steps span.ok{background:var(--ok);color:#fff}.steps span.bad{background:var(--bad);color:#fff}
/* results */
.score-big{font-size:46px;font-weight:900;line-height:1;color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.bar-row{display:grid;grid-template-columns:minmax(100px,170px) 1fr 48px;gap:8px;align-items:center;font-size:14px}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .8s}
.rag{display:grid;gap:6px;margin-top:8px}
.rag-row{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:14px}
.rag-pill{text-align:center;border-radius:99px;font-weight:800;font-size:12.5px;padding:4px 6px;color:#fff}
.rag-pill.R{background:var(--red)}.rag-pill.A{background:var(--amber)}.rag-pill.G{background:var(--green)}.rag-pill.N{background:var(--line);color:var(--muted)}
.revise{counter-reset:r;list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.revise li{counter-increment:r;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bad-bg);font-weight:600}
.revise li::before{content:counter(r);width:26px;height:26px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.stack>*+*{margin-top:12px}
/* anims */
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes goodflash{0%{filter:none}40%{filter:drop-shadow(0 0 6px var(--ok)) brightness(1.2)}100%{filter:none}}
@keyframes badflash{0%,100%{filter:none}30%,70%{filter:drop-shadow(0 0 5px var(--bad)) saturate(.3)}}
@keyframes pulsepart{0%,100%{filter:none}50%{filter:drop-shadow(0 0 7px var(--accent)) brightness(1.2)}}
@keyframes flowdown{from{transform:translateY(0)}to{transform:translateY(20px)}}
@keyframes flowup{from{transform:translateY(0)}to{transform:translateY(-20px)}}
.shake{animation:shake .4s}
.pop-in{animation:pop .3s}
@media (max-width:560px){
  main{padding:12px 12px 50px}
  .card{padding:14px;border-radius:14px}
  .mm-branches{grid-template-columns:1fr}
  .scols.three{grid-template-columns:1fr}
  .lab{grid-template-columns:1fr}
  .cells{grid-template-columns:1fr}
  .reason{grid-template-columns:1fr}.reason .fix{grid-column:1}
  .witem{font-size:12.5px;padding:7px 8px}
  .szone .tok{font-size:12.5px;padding:6px 7px}
  .bf-card .tok{font-size:11.5px}
  .gh{font-size:12.5px;padding:5px}
  .act-mid .btn,.actions>.btn{flex:1}
  .ans-list div{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ================= storage ================= */
const STORE_KEY='igcse-bio-topic16-quiz-v1';
let S={results:{},conf:{},run:null,lastRun:null};

/* ================= theme ================= */
function initTheme(){

  $('#themeBtn').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');

    try{ localStorage.setItem(STORE_KEY+'-theme',nx); }catch(e){}

/* ================= drag & drop (mouse + touch + tap-to-place) ================= */
const DnD={
  sel:null,
  attach(root,onDrop){
    root.addEventListener('pointerdown',e=>{
      if(e.button>0) return;
      const tok=e.target.closest('.tok');
      if(!tok||!root.contains(tok)||tok.classList.contains('locked')||root.classList.contains('locked')) return;
      e.preventDefault();
      const r=tok.getBoundingClientRect();
      const offX=e.clientX-r.left, offY=e.clientY-r.top, sx=e.clientX, sy=e.clientY;
      let ghost=null, over=null;
      const mv=ev=>{
        if(!ghost){
          if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6) return;
          DnD.clear();
          ghost=tok.cloneNode(true); ghost.classList.add('dnd-ghost'); ghost.classList.remove('sel');
          ghost.style.width=r.width+'px'; document.body.appendChild(ghost); tok.classList.add('dragging');
        }
        ev.preventDefault();
        ghost.style.transform=`translate(${ev.clientX-offX}px,${ev.clientY-offY}px) rotate(-2deg)`;
        const z=DnD.zoneAt(root,ev.clientX,ev.clientY);
        if(z!==over){ over&&over.classList.remove('over'); over=z; z&&z.classList.add('over'); }

      };
      const up=ev=>{
        window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
        over&&over.classList.remove('over');
        if(ghost){
          ghost.remove(); tok.classList.remove('dragging');
          if(ev.type==='pointerup'){ const z=DnD.zoneAt(root,ev.clientX,ev.clientY); if(z) onDrop(tok,z); }
        } else if(ev.type==='pointerup'){
          // tap
          const sel=DnD.sel;
          if(sel===tok){ DnD.clear(); return; }
          const tz=tok.parentElement.closest('[data-zone]');
          if(sel&&root.contains(sel)&&tz&&tz.dataset.cap==='1'&&tz!==sel.parentElement.closest('[data-zone]')){ DnD.clear(); onDrop(sel,tz); return; }
          DnD.clear(); DnD.sel=tok; tok.classList.add('sel'); root.classList.add('selecting');
        }
      };
      window.addEventListener('pointermove',mv,{passive:false}); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
    });
    root.addEventListener('click',e=>{
      if(!DnD.sel||!root.contains(DnD.sel)) return;
      if(e.target.closest('.tok')) return;
      const z=e.target.closest('[data-zone]');
      if(z&&root.contains(z)){ const t=DnD.sel; DnD.clear(); onDrop(t,z); }
    });
  },
  clear(){ if(DnD.sel){ DnD.sel.classList.remove('sel'); $$('.selecting').forEach(x=>x.classList.remove('selecting')); } DnD.sel=null; },
  zoneAt(root,x,y){ const el=document.elementFromPoint(x,y); const z=el&&el.closest('[data-zone]'); return z&&root.contains(z)?z:null; }
};
function zb(z){ return z.querySelector(':scope > .zb')||z; }
/* put a token into a zone; single-capacity zones swap their occupant back */
function place(tok,zone,pool){
  const from=tok.parentElement.closest('[data-zone]');
  if(zone===from) return;
  if(zone.dataset.cap==='1'){
    $$('.tok',zb(zone)).forEach(o=>{ if(o!==tok){ const back=(from&&from!==zone)?from:pool; zb(back).appendChild(o); } });
  }
  zb(zone).appendChild(tok);
  anim(tok,[{transform:'scale(.92)'},{transform:'scale(1)'}],{duration:160});
}
function tokEl(text,data){ const t=h('div',{class:'tok',role:'button',tabindex:'0'},text); for(const k in (data||{})) t.dataset[k]=data[k]; return t; }

/* ================= tolerant keyword marking ================= */
function norm(t,keepStar){
  t=String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  t=t.replace(/z/g,'s').replace(/oe/g,'e').replace(/our/g,'or').replace(/ph/g,'f');
  t=t.replace(keepStar?/[^a-z0-9*\s]/g:/[^a-z0-9\s]/g,' ');
  return t.replace(/\s+/g,' ').trim();
}
function lev(a,b){
  if(a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; }
  return p[n];
}
function wordHit(tok,w){
  if(w.endsWith('*')){ const p=w.slice(0,-1); if(tok.startsWith(p)) return true; if(tok.length<p.length) return false; if(p.length>=5) return lev(tok.slice(0,p.length),p)<=1; return p.length===4&&tok[0]===p[0]&&lev(tok.slice(0,4),p)<=1; }

function tokens(text){ return norm(text).split(' ').filter(Boolean); }
/* term syntax:  "a b|c+d*"  →  ('a b' OR 'c') AND 'd*'  ; multi-word alternatives need every word present */
function termMatch(toks,term){
  return term.split('+').every(part=>part.split('|').some(alt=>{
    const ws=norm(alt,true).split(' ').filter(Boolean);
    return ws.length>0&&ws.every(w=>toks.some(t=>wordHit(t,w)));

/* ================= DIAGRAMS ================= */
/* --- half-flower (longitudinal section). Drawn in local coords, shifted +20 into a 440×440 viewBox --- */
const FLOWER_PARTS={

  anther:`<g class="part f-anther" data-part="anther"><ellipse class="ol" cx="149" cy="178" rx="10" ry="18" transform="rotate(-12 149 178)"/><ellipse class="ol" cx="251" cy="178" rx="10" ry="18" transform="rotate(12 251 178)"/></g>`,
  style:`<g class="part f-style" data-part="style"><path class="ol" d="M194,270 L194,162 L206,162 L206,270 Z"/></g>`,
  ovary:`<g class="part f-ovary" data-part="ovary"><ellipse class="ol" cx="200" cy="298" rx="31" ry="33"/><ellipse class="cav" cx="200" cy="298" rx="21" ry="25"/></g>`,
  ovule:`<g class="part f-ovule" data-part="ovule"><ellipse class="ol" cx="193" cy="283" rx="8" ry="9.5"/><ellipse class="ol" cx="207" cy="298" rx="8" ry="9.5"/><ellipse class="ol" cx="193" cy="313" rx="8" ry="9.5"/></g>`,
  stigma:`<g class="part f-stigma" data-part="stigma"><path class="ol" d="M180,167 C177,141 223,141 220,167 Q200,157 180,167 Z"/></g>`,
};
const FLOWER_ORDER=['sepal','petal','nectary','filament','anther','style','ovary','ovule','stigma'];
const FLOWER_INFO={
  stigma:['Stigma','Sticky surface that catches pollen grains.'],
  style:['Style','Holds the stigma up; the pollen tube grows down through it to the ovary.'],
  anther:['Anther','Makes and releases pollen grains (contain the male gametes).'],

  petal:['Petal','Large and brightly coloured to attract insects.'],
  nectary:['Nectary','Makes sugary nectar to attract insects.'],

/* label positions (viewBox 440×440) and anchor points (flower coords, +20 added when drawn) */
const FSPOT={
  anther:{x:52,y:100,ax:141,ay:175}, petal:{x:52,y:165,ax:96,ay:216}, stamen:{x:52,y:228,ax:141,ay:250},
  filament:{x:52,y:290,ax:168,ay:270}, sepal:{x:52,y:362,ax:115,ay:338},
  stigma:{x:388,y:80,ax:214,ay:155}, style:{x:388,y:145,ax:206,ay:212}, carpel:{x:388,y:212,ax:239,ay:240},
  ovule:{x:388,y:278,ax:214,ay:298}, ovary:{x:388,y:345,ax:227,ay:316},

function flowerSVG(o={}){

/* --- generic label board: SVG + HTML drop hotspots + token pool --- */
function labelBoard(svgHTML,vbW,vbH,spots,labels){
  const root=h('div',{class:'dnd'});
  const board=h('div',{class:'board',html:svgHTML});
  for(const sp of spots) board.append(h('div',{class:'hot','data-zone':sp.id,'data-cap':'1',style:`left:${sp.x/vbW*100}%;top:${sp.y/vbH*100}%`}));
  const pool=h('div',{class:'pool','data-zone':'pool'});
  shuffle(labels).forEach(l=>pool.append(tokEl(l.t,{a:l.a})));
  root.append(board,h('div',{class:'pool-label'},'Labels – drag them onto the boxes (or tap a label, then tap a box):'),pool);
  DnD.attach(root,(t,z)=>place(t,z,pool));
  return {root,board,pool,
    filled:()=>$$('.hot',board).every(x=>x.querySelector('.tok')),
    mark(){ let ok=0; $$('.hot',board).forEach(hot=>{ const t=hot.querySelector('.tok'); const good=t&&t.dataset.a===hot.dataset.zone; ok+=good?1:0; hot.classList.add(good?'ok':'bad'); if(t){ t.classList.add(good?'ok':'bad','locked'); if(!good){ const right=labels.find(l=>l.a===hot.dataset.zone); t.innerHTML=`<span><s>${esc(t.textContent)}</s> ${esc(right?right.t:'')}</span>`; } } }); root.classList.add('locked'); return ok; }
  };
}

const T={};

/* ---------- free text, keyword marking ---------- */
T.text=(q,b,ctx)=>{
  let cl=null;
  if(q.checklist){
    cl=h('div',{class:'checklist'},q.keys.map(k=>h('div',{class:'ck'},h('span',{class:'box'}),k.label)));
    b.append(h('p',{class:'small muted'},'Mark scheme – a box lights up for each point your answer covers:'),cl);
  }
  const ta=h('textarea',{class:'ta',rows:q.rows||4,placeholder:'Type your answer here…','aria-label':'Your answer'});
  b.append(ta);
  ctx.check('Check answer',()=>{
    const v=ta.value.trim();
    if(v.replace(/\s/g,'').length<3){ ctx.say('Type an answer first.','info'); ta.focus(); return false; }
    const toks=tokens(v); const res=q.keys.map(k=>k.any.some(t=>termMatch(toks,t)));
    const found=res.filter(Boolean).length, need=q.need||q.keys.length;
    ta.readOnly=true;

    const chips=q.keys.map((k,i)=>`<span class="kw ${res[i]?'ok':'miss'}">${res[i]?'✓':'✗'} ${esc(k.label)}</span>`).join('');
    ctx.finish(found/need,`Key ideas found: <b>${found}/${q.keys.length}</b> (${need} needed for full marks)<div class="kwrow">${chips}</div><div class="model"><b>Model answer</b><br>${q.model}</div>`);
  });
};

/* ---------- table: click-to-cycle cells or segmented buttons ---------- */
T.grid=(q,b,ctx)=>{
  const g=h('div',{class:'gtable',style:`grid-template-columns:minmax(110px,1.35fr) repeat(${q.cols.length},minmax(0,1fr))`});
  g.append(h('div',{class:'gh corner'},q.corner||''),...q.cols.map(c=>h('div',{class:'gh'},c)));
  const cells=[];
  q.rows.forEach(r=>{
    g.append(h('div',{class:'gh rowh'},r.label));
    q.cols.forEach((c,ci)=>{
      const cell={r,ci,val:null,el:null};
      if(q.style==='cycle'){
        const bt=h('button',{class:'cyc',type:'button','aria-label':`${r.label}, ${c}: tap to change`},'?');
        bt.onclick=()=>{ const o=r.opts; cell.val=o[cell.val==null?0:(o.indexOf(cell.val)+1)%o.length]; bt.textContent=cell.val; bt.classList.add('set'); anim(bt,[{transform:'rotateX(80deg)'},{transform:'none'}],{duration:180}); };
        cell.el=bt; g.append(h('div',{class:'gc'},bt));
      } else {
        const seg=h('div',{class:'segw',role:'group','aria-label':`${r.label}, ${c}`});
        r.opts.forEach(o=>{ const bt=h('button',{type:'button',class:'segb'},o); bt.onclick=()=>{ if(seg.classList.contains('locked')) return; cell.val=o; $$('.segb',seg).forEach(x=>x.classList.toggle('on',x===bt)); }; seg.append(bt); });
        cell.el=seg; g.append(h('div',{class:'gc'},seg));
      }
      cells.push(cell);
    });
  });
  if(q.style==='cycle') b.append(h('p',{class:'small muted'},'Tap a box to cycle through the options.'));
  b.append(h('div',{class:'scrollx'},g));
  ctx.check('Check',()=>{
    if(cells.some(c=>c.val==null)){ ctx.say('Fill in every box first.','info'); return false; }
    let ok=0;
    cells.forEach(c=>{ const right=c.r.ans[c.ci], good=c.val===right; ok+=good; c.el.parentElement.classList.add(good?'ok':'bad');
      if(q.style==='cycle'){ c.el.disabled=true; if(!good) c.el.innerHTML=`<s>${esc(c.val)}</s> ${esc(right)}`; }
      else { c.el.classList.add('locked'); if(!good) $$('.segb',c.el).forEach(x=>{ if(x.textContent===right) x.classList.add('should'); }); } });
    ctx.finish(ok/cells.length,`${ok}/${cells.length} boxes correct.${q.explain?'<div class="model">'+q.explain+'</div>':''}`);
  });
};

/* ---------- connect with wires ---------- */
T.wires=(q,b,ctx)=>{
  const wrap=h('div',{class:'wires'}); const L=h('div',{class:'wcol l'}), R=h('div',{class:'wcol r'});
  const svg=s('svg',{class:'ovl'}); wrap.append(svg,L,R);
  const P=q.pairs, COL=['#3563d9','#d9822b','#8b5cf6','#0f9d8a','#d6457a','#6b8e23','#c0392b','#2e86c1','#a0522d','#7d3c98','#16a085','#b7950b'];
  const conn={}; let selL=null, selR=null, locked=false;
  const lEls={}, rEls={};
  shuffle(P.map((p,i)=>i)).forEach(i=>{ const e=h('button',{class:'witem',type:'button'},P[i][0]); e.onclick=()=>pick('L',i); lEls[i]=e; L.append(e); });
  shuffleNotSame(P.map((p,i)=>i)).forEach(i=>{ const e=h('button',{class:'witem',type:'button'},P[i][1]); e.onclick=()=>pick('R',i); rEls[i]=e; R.append(e); });
  b.append(h('p',{class:'small muted'},'Tap an item on the left, then its match on the right. Tap again to change.'),wrap);
  function pick(side,i){
    if(locked) return;
    if(side==='L') selL=selL===i?null:i; else selR=selR===i?null:i;
    if(selL!=null&&selR!=null){ for(const k in conn) if(conn[k]===selR) delete conn[k]; conn[selL]=selR; selL=selR=null; }
    refresh();
  }
  function refresh(){
    for(const i in lEls){ lEls[i].classList.toggle('sel',+i===selL); lEls[i].classList.toggle('linked',conn[i]!=null); }
    const used=new Set(Object.values(conn)); for(const i in rEls){ rEls[i].classList.toggle('sel',+i===selR); rEls[i].classList.toggle('linked',used.has(+i)); }
    draw();
  }
  function draw(){
    svg.innerHTML='';
    for(const k in conn){
      const a=relBox(lEls[k],wrap), z=relBox(rEls[conn[k]],wrap);
      const col=wrap.classList.contains('checked')?(+k===conn[k]?'var(--ok)':'var(--bad)'):COL[k%COL.length];
      svg.append(s('path',{d:curve(a.r,a.cy,z.l,z.cy),stroke:col}));
      svg.append(s('circle',{cx:a.r,cy:a.cy,r:4,fill:col})); svg.append(s('circle',{cx:z.l,cy:z.cy,r:4,fill:col}));
    }
  }
  observeResize(wrap,draw);
  ctx.check('Check',()=>{
    if(Object.keys(conn).length<P.length){ ctx.say(`Connect all ${P.length} items first.`,'info'); return false; }
    locked=true; wrap.classList.add('checked'); let ok=0;
    for(const k in conn){ const good=+k===conn[k]; ok+=good; lEls[k].classList.add(good?'ok':'bad'); rEls[conn[k]].classList.add(good?'ok':'bad'); if(!good) lEls[k].append(h('span',{class:'corr'},'✓ '+P[k][1])); }
    draw();
    ctx.finish(ok/P.length,`${ok}/${P.length} matches correct.${ok<P.length?' Correct matches are shown in green under each wrong item.':''}`);
  });
};

/* ---------- germination virtual lab ---------- */
T.germ=(q,b,ctx)=>{
  const F=[['water','💧','Water'],['warmth','🌡️','Warmth'],['oxygen','🫧','Oxygen'],['light','☀️','Light']];

  lab.append(sw,pic);
  b.append(h('p',{class:'small muted'},'Switch ON only the conditions a seed NEEDS to germinate, then run the experiment.'),lab);
  const svg=$('svg',pic);

    $('.g-light',svg).setAttribute('opacity',on.light?1:0); $('.g-dark',svg).setAttribute('opacity',on.light?0:1);

  }
  paint();
  const NEED=['water','warmth','oxygen'];

    water:'Activates enzymes and lets the seed swell, so stored food can be broken down and moved to the growing parts',
    warmth:'Gives a suitable temperature for enzymes to work',

  };

      const lv=$('.g-leaves',svg); lv.setAttribute('opacity',1); svgFit(lv); await anim(lv,[{transform:'scale(.2)'},{transform:'scale(1)'}],{duration:500});
      $('.g-msg',svg).textContent='Germinated!';

    const sel=F.map(f=>f[0]).filter(k=>on[k]); const exact=sel.length===3&&NEED.every(k=>on[k]);

    else msg=`✗ It ${grows?'germinated':'did not germinate'}. A seed needs <b>water, warmth and oxygen</b> – but not light.`;

    b.append(box); fin.hidden=false; box.scrollIntoView({behavior:'smooth',block:'nearest'});

      const flash=nm=>{ const p=$(`[data-h="${nm}"] .curve`,svg); p.classList.add('hov'); setTimeout(()=>p.classList.remove('hov'),1800); };
      flash(n); if(!good) setTimeout(()=>flash(t.ans),300);
      done(good,`${good?'✓':'✗ You chose '+n+'.'} ${t.why}`); }
  });
  svg.addEventListener('pointerover',e=>{ const g=e.target.closest('[data-h]'); if(g&&svg.classList.contains('curvemode')) info.textContent=g.dataset.h; });
};

ANIMS.pollination=async(st,slots)=>{
  const board=h('div',{class:'board',html:flowerSVG()}); const cap=h('div',{class:'caption'}); const rep=h('button',{class:'btn sm ghost',type:'button'},'↻ Replay animation');
  st.append(board,cap,h('div',{style:'text-align:center;margin-top:6px'},rep));
  let token=0;
  const play=async()=>{
    const my=++token; const alive=()=>my===token&&document.body.contains(board);
    board.innerHTML=flowerSVG(); const svg=$('svg',board); const ex=$('.extra',svg);
    const li=$$('.slot',slots);
    const stepTo=async(k,txt,ms)=>{ if(!alive()) return false; li.forEach((x,j)=>x.classList.toggle('playing',j===k)); cap.textContent=`${k+1}. ${txt}`; await sleep(ms); return alive(); };
    const grain=s('circle',{cx:200,cy:150,r:5,fill:'var(--d-anther)',stroke:'var(--d-stroke)'}); ex.append(grain);
    const tubeD='M200,152 L200,262 C200,282 197,292 193,293';
    const tube=s('path',{d:tubeD,fill:'none',stroke:'#e2a23b','stroke-width':3,'stroke-dasharray':'160','stroke-dashoffset':'160','stroke-linecap':'round'}); ex.append(tube);
    const nuc=s('circle',{cx:200,cy:152,r:3.5,fill:'var(--d-nucleus)',opacity:0}); ex.append(nuc);
    anim(grain,[{transform:'translate(-70px,-90px)',opacity:0},{transform:'translate(0,0)',opacity:1}],{duration:1000,easing:'ease-out'});
    if(!await stepTo(0,'Pollen lands on the stigma',1300)) return;
    tube.style.transition='stroke-dashoffset 1.8s ease-in-out'; tube.setAttribute('stroke-dashoffset','0');
    if(!await stepTo(1,'A pollen tube grows down the style',2000)) return;
    nuc.setAttribute('opacity',1); const L=tube.getTotalLength(); const t0=performance.now();
    await new Promise(res=>{ const f=now=>{ const k=Math.min(1,(now-t0)/1500); const p=tube.getPointAtLength(L*k); nuc.setAttribute('cx',p.x); nuc.setAttribute('cy',p.y); if(k<1&&alive()) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); cap.textContent='3. The pollen (male) nucleus travels down the tube into the ovule'; li.forEach((x,j)=>x.classList.toggle('playing',j===2)); });
    if(!await stepTo(2,'The pollen (male) nucleus enters the ovule',300)) return;
    const ov=svg.querySelector('[data-part="ovule"] ellipse'); svgFit(ov);
    anim(ov,[{filter:'none'},{filter:'drop-shadow(0 0 8px #fff) brightness(1.6)'},{filter:'none'}],{duration:900}); nuc.setAttribute('opacity',0);
    if(!await stepTo(3,'Fertilisation: male nucleus fuses with the female nucleus',1300)) return;
    const emb=s('circle',{cx:193,cy:283,r:0,fill:'var(--d-stem)'}); ex.append(emb); emb.style.transition='r 1s'; requestAnimationFrame(()=>emb.setAttribute('r',4));
    if(!await stepTo(4,'The zygote divides and develops into an embryo',1500)) return;
    const ovs=$$('[data-part="ovule"] ellipse',svg); ovs.forEach(o=>{ o.style.transition='fill 1s, stroke-width 1s'; o.style.fill='#a8743f'; o.style.strokeWidth='3'; }); tube.style.transition='opacity .8s'; tube.style.opacity='0';
    if(!await stepTo(5,'Each ovule becomes a seed (with a tough seed coat)',1700)) return;
    const ovary=svg.querySelector('[data-part="ovary"]'); svgFit(ovary); ovary.style.transition='transform 1.4s, filter 1.4s'; ovary.style.transform='scale(1.35)'; $('ellipse',ovary).style.transition='fill 1.4s'; $('ellipse',ovary).style.fill='#f08a3c';
    ['petal','anther','filament','stigma','style','nectary'].forEach(p=>{ const g=svg.querySelector(`[data-part="${p}"]`); if(g){ g.style.transition='opacity 1.4s'; g.style.opacity='.12'; } });
    if(!await stepTo(6,'The ovary becomes the fruit (petals and stamens wither)',2200)) return;
    li.forEach(x=>x.classList.remove('playing')); cap.textContent='From pollination to fruit ✓';
  };
  rep.onclick=play; play();
};
ANIMS.hiv=async(st,slots)=>{
  const N=14; const row=h('div',{style:'display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0'});
  const cells=Array.from({length:N},()=>h('span',{style:'width:24px;height:24px;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent);display:inline-block;transition:all .6s'}));
  row.append(...cells);
  const meters=h('div',{class:'bars'}); const mk=(n,col)=>{ const i=h('i',{style:`width:100%;background:${col}`}); const v=h('span',{},'100%'); meters.append(h('div',{class:'bar-row'},h('span',{},n),h('div',{class:'bar'},i),v)); return [i,v]; };
  const [lymB,lymV]=mk('Lymphocytes','var(--accent)'), [abB,abV]=mk('Antibodies made','var(--c-pro)');
  const cap=h('div',{class:'caption'}); const rep=h('button',{class:'btn sm ghost',type:'button'},'↻ Replay');
  st.append(row,meters,cap,h('div',{style:'text-align:center'},rep));
  let token=0;
  const play=async()=>{
    const my=++token; const alive=()=>my===token&&document.body.contains(st); const li=$$('.slot',slots);
    cells.forEach(c=>{c.style.opacity=1;c.style.background='var(--accent-soft)';c.style.transform='none';}); lymB.style.width='100%'; abB.style.width='100%'; lymV.textContent=abV.textContent='100%';
    const set=(p)=>{ lymB.style.width=p+'%'; lymV.textContent=p+'%'; };
    const go=async(k,txt,ms)=>{ if(!alive()) return false; li.forEach((x,j)=>x.classList.toggle('playing',j===k)); cap.textContent=txt; await sleep(ms); return alive(); };
    cells.slice(0,9).forEach(c=>c.style.background='var(--c-lh)');
    if(!await go(0,'HIV infects lymphocytes (white blood cells)',1500)) return;
    cells.slice(0,9).forEach(c=>{c.style.opacity=.15;c.style.transform='scale(.6)';}); set(36);
    if(!await go(1,'Infected lymphocytes are destroyed – the number falls',1500)) return;
    abB.style.width='30%'; abV.textContent='30%';
    if(!await go(2,'Fewer lymphocytes → fewer antibodies are made',1500)) return;
    if(!await go(3,'The immune system is weakened',1300)) return;
    cells.slice(9).forEach(c=>{c.style.opacity=.15;c.style.transform='scale(.6)';}); set(8); abB.style.width='6%'; abV.textContent='6%';
    if(!await go(4,'Opportunistic infections (e.g. TB, pneumonia) cannot be fought off = AIDS',1800)) return;
    li.forEach(x=>x.classList.remove('playing'));
  };
  rep.onclick=play; play();
};

const QMAP={}; Q.forEach(q=>QMAP[q.id]=q);

/* ================= ENGINE ================= */
const app=$('#app');
const confName={1:'Not confident',2:'Somewhat confident',3:'Confident'};
const confCol={1:'var(--red)',2:'var(--amber)',3:'var(--green)'};
function secScore(ids,scores){ const v=ids.filter(id=>scores[id]!=null).map(id=>scores[id]); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; }
function rag(x){ return x==null?'N':x>=.8?'G':x>=.5?'A':'R'; }
const RAGN={R:'Red',A:'Amber',G:'Green',N:'Not tried'};
const allScores=()=>{ const o={}; for(const k in S.results) o[k]=S.results[k].s; return o; };

function home(){
  DnD.clear(); window.scrollTo(0,0); app.innerHTML='';
  const sc=allScores();
  app.append(h('div',{class:'hero'},h('div',{class:'tag'},'Cambridge IGCSE Biology 0610 · Extended'),h('h1',{},'Topic 16: Reproduction'),h('p',{class:'muted'},`Interactive revision quiz – ${Q.length} questions. Choose a section or take the full test.`)));
  if(S.run&&S.run.idx<S.run.ids.length){
    const r=S.run; app.append(h('div',{class:'card resume'},h('div',{},h('b',{},'Continue where you left off'),h('div',{class:'small muted'},`${r.label} – question ${r.idx+1} of ${r.ids.length}`)),h('div',{class:'row'},h('button',{class:'btn ghost sm',onclick:()=>{S.run=null;save();home();}},'Discard'),h('button',{class:'btn primary',onclick:showQ},'Resume →'))));
  }
  const grid=h('div',{class:'sec-grid'}); const panel=h('div');
  for(const [k,sec] of Object.entries(SECTIONS)){
    const ids=Q.filter(q=>q.sec===k).map(q=>q.id); const x=secScore(ids,sc); const done=ids.filter(id=>sc[id]!=null).length;
    grid.append(h('button',{class:'card sec-card',type:'button',onclick:()=>askConf(k,panel)},h('span',{class:'num'},sec.n),h('span',{class:'name'},sec.t),
      h('span',{class:'meta'},h('span',{},`${ids.length} questions · ${done} done`),x==null?h('span',{class:'badge'},'new'):h('span',{class:'badge '+rag(x).toLowerCase()},pct(x)+'%'))));
  }
  grid.append(h('button',{class:'card sec-card full-card',type:'button',onclick:()=>askConf('all',panel)},h('span',{class:'num'},'All sections'),h('span',{class:'name'},'Full test'),h('span',{class:'meta'},h('span',{},`${Q.length} questions, mixed`),h('span',{class:'badge'},'★'))));
  app.append(grid,panel);
  if(Object.keys(S.results).length) app.append(h('div',{class:'row',style:'margin-top:18px;justify-content:space-between'},
    h('button',{class:'btn sm',onclick:()=>{ S.lastRun={label:'All progress',ids:Q.map(q=>q.id),scores:allScores(),conf:null}; results(true); }},'📊 My progress & RAG grid'),
    h('button',{class:'btn ghost sm',onclick:e=>{ const bt=e.currentTarget; if(bt.dataset.arm){ S={results:{},conf:{},run:null,lastRun:null}; save(); home(); } else { bt.dataset.arm='1'; bt.textContent='Tap again to delete everything'; setTimeout(()=>{ if(bt.isConnected){ delete bt.dataset.arm; bt.textContent='Reset all progress'; } },4000); } }},'Reset all progress')));
}
function askConf(k,panel){
  const name=k==='all'?'the full test':`${SECTIONS[k].n} ${SECTIONS[k].t}`;
  panel.innerHTML='';
  const c=h('div',{class:'card conf-panel'},h('h3',{},'Before you start – my confidence level'),h('p',{class:'small muted'},`How confident do you feel about ${name}?`),
    h('div',{class:'conf-opts'},[1,2,3].map(v=>h('button',{type:'button',onclick:()=>{ S.conf[k]=v; const ids=k==='all'?shuffle(Q.map(q=>q.id)):Q.filter(q=>q.sec===k).map(q=>q.id); startRun(k==='all'?'Full test':`${SECTIONS[k].n} ${SECTIONS[k].t}`,ids,v,k); }},h('span',{class:'dot',style:`background:${confCol[v]}`}),confName[v]))));
  panel.append(c); c.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function startRun(label,ids,conf,key){ S.run={label,ids,idx:0,scores:{},conf,key}; save(); showQ(); }

function showQ(){
  DnD.clear(); const run=S.run; if(!run) return home();
  if(run.idx>=run.ids.length) return finishRun();
  const q=QMAP[run.ids[run.idx]]; if(!q){ run.idx++; return showQ(); }
  window.scrollTo(0,0); app.innerHTML='';
  const answered=Object.keys(run.scores).length; const tot=Object.values(run.scores).reduce((a,b)=>a+b,0);
  app.append(h('div',{class:'qhead'},h('span',{},h('span',{class:'tag'},SECTIONS[q.sec].n),' ',h('b',{},`Question ${run.idx+1} / ${run.ids.length}`)),
    h('span',{class:'muted small'},answered?`Score so far: ${pct(tot/answered)}%`:run.label)));
  app.append(h('div',{class:'pbar'},h('i',{style:`width:${run.idx/run.ids.length*100}%`})));
  const card=h('div',{class:'card qcard'}); app.append(card);
  card.append(h('h2',{},q.title),h('p',{class:'qprompt',html:q.prompt}));
  const body=h('div',{class:'qbody'}); const fb=h('div',{class:'feedback','aria-live':'polite'}); const hint=h('div',{class:'hint',hidden:true},'💡 '+q.hint);
  const mid=h('div',{class:'act-mid'});
  const last=run.idx===run.ids.length-1;
  const nextBtn=h('button',{class:'btn primary',type:'button',disabled:true,onclick:()=>{ run.idx++; save(); showQ(); }},last?'See results':'Next →');
  const actions=h('div',{class:'actions'},h('button',{class:'btn ghost',type:'button',onclick:()=>{ hint.hidden=!hint.hidden; }},'💡 Hint'),mid,nextBtn);
  card.append(body,hint,fb,actions);
  app.append(h('div',{class:'row',style:'margin-top:12px;justify-content:space-between'},h('button',{class:'btn ghost sm',onclick:home},'← Save & quit'),
    h('button',{class:'btn ghost sm',onclick:()=>{ run.scores[q.id]=run.scores[q.id]??0; run.idx++; save(); showQ(); }},'Skip question')));
  let done=false;
  const ctx={
    check(label,fn){ const bt=h('button',{class:'btn primary chk',type:'button'},label); let busy=false;
      bt.addEventListener('click',async()=>{ if(busy||done) return; busy=true; try{ await fn(); }catch(e){ console.error(e); } finally{ busy=false; } }); mid.append(bt); return bt; },
    btn(label,fn,cls){ const bt=h('button',{class:'btn '+(cls||''),type:'button',onclick:fn},label); mid.append(bt); return bt; },
    say(html,kind){ fb.className='feedback show '+(kind||'info'); fb.innerHTML=html; },
    finish(score,html){
      if(done) return; done=true; score=Math.max(0,Math.min(1,score||0));
      run.scores[q.id]=score; S.results[q.id]={s:score,t:Date.now()}; save();
      const kind=score>=.999?'ok':score>=.5?'part':'bad';
      const head=kind==='ok'?'✓ Correct!':kind==='part'?'◐ Partly right':'✗ Not quite';
      ctx.say(`<div class="big">${head} <span class="small">(${pct(score)}%)</span></div>${html||''}`,kind);
      $$('.chk',mid).forEach(b=>b.disabled=true); nextBtn.disabled=false;
      anim(fb,[{transform:'scale(.98)'},{transform:'scale(1.01)'},{transform:'none'}],{duration:300});
    }
  };
  try{ T[q.type](q,body,ctx); }catch(e){ console.error(e); body.append(h('p',{class:'feedback show bad'},'Sorry – this question failed to load. Press Skip.')); }
}
function finishRun(){
  const r=S.run; S.lastRun={label:r.label,ids:r.ids,scores:r.scores,conf:r.conf,key:r.key}; S.run=null; save(); results(false);
}
function results(progressOnly){
  DnD.clear(); window.scrollTo(0,0); app.innerHTML='';
  const L=S.lastRun; if(!L) return home();
  const all=allScores();
  const runScore=secScore(L.ids,Object.fromEntries(L.ids.map(id=>[id,L.scores[id]??0])));
  const wrap=h('div',{class:'stack'}); app.append(wrap);
  if(!progressOnly){
    wrap.append(h('div',{class:'card',style:'text-align:center'},h('div',{class:'muted'},L.label),h('div',{class:'score-big'},pct(runScore)+'%'),
      h('p',{},`${L.ids.filter(id=>(L.scores[id]??0)>=.999).length} of ${L.ids.length} questions fully correct`),
      L.conf?h('p',{class:'small muted'},`Confidence before: `,h('b',{style:`color:${confCol[L.conf]}`},confName[L.conf]),` → result: `,h('b',{},rag(runScore)==='G'?'Green':rag(runScore)==='A'?'Amber':'Red')):null));
  } else wrap.append(h('h1',{},'My progress'));
  // section bars
  const bars=h('div',{class:'bars'}); const secs=Object.keys(SECTIONS).filter(k=>L.ids.some(id=>QMAP[id].sec===k));
  secs.forEach(k=>{ const ids=L.ids.filter(id=>QMAP[id].sec===k); const x=secScore(ids,progressOnly?all:Object.fromEntries(ids.map(id=>[id,L.scores[id]??0])));
    const col=x==null?'var(--line)':`var(--${({G:'green',A:'amber',R:'red'})[rag(x)]})`;
    bars.append(h('div',{class:'bar-row'},h('span',{},h('b',{},SECTIONS[k].n),' ',h('span',{class:'small muted'},SECTIONS[k].t)),h('div',{class:'bar'},h('i',{style:`width:0;background:${col}`,'data-w':x==null?0:pct(x)})),h('b',{},x==null?'–':pct(x)+'%'))); });
  wrap.append(h('div',{class:'card'},h('h3',{},'Score by section'),bars));
  requestAnimationFrame(()=>setTimeout(()=>$$('.bar i',bars).forEach(i=>i.style.width=i.dataset.w+'%'),50));
  // three topics to revise (all-time data)
  const secRank=Object.keys(SECTIONS).map(k=>({n:`${SECTIONS[k].n} ${SECTIONS[k].t}`,x:secScore(Q.filter(q=>q.sec===k).map(q=>q.id),all)})).filter(o=>o.x!=null&&o.x<.999).sort((a,b)=>a.x-b.x);
  const objRank=OBJ.map(([id,t])=>({n:t,x:secScore(Q.filter(q=>q.obj.includes(id)).map(q=>q.id),all)})).filter(o=>o.x!=null&&o.x<.999).sort((a,b)=>a.x-b.x);
  let three=secRank.slice(0,3); if(three.length<3) three=three.concat(objRank.slice(0,3-three.length));
  wrap.append(h('div',{class:'card'},h('h3',{},'Three topics I need to revise again'),
    three.length?h('ol',{class:'revise'},three.map(o=>h('li',{},h('span',{style:'flex:1'},o.n),h('span',{class:'badge'},pct(o.x)+'%')))):h('p',{class:'muted'},'Nothing weak so far – great work! Try another section or the full test.')));
  // RAG grid
  wrap.append(h('div',{class:'card'},h('h3',{},'Checklist – RAG rating'),h('p',{class:'small muted'},'Green ≥ 80 %, Amber 50–79 %, Red < 50 % (based on your latest answer to each question).'),
    h('div',{class:'rag'},OBJ.map(([id,t])=>{ const r=rag(secScore(Q.filter(q=>q.obj.includes(id)).map(q=>q.id),all)); return h('div',{class:'rag-row'},h('span',{},t),h('span',{class:'rag-pill '+r},RAGN[r])); }))));
  // buttons
  const wrong=L.ids.filter(id=>(L.scores[id]??0)<.999);
  wrap.append(h('div',{class:'row',style:'justify-content:center'},
    !progressOnly&&wrong.length?h('button',{class:'btn primary',onclick:()=>startRun('Review my mistakes',wrong,null,'review')},`Review my mistakes (${wrong.length})`):null,
    !progressOnly?h('button',{class:'btn',onclick:()=>startRun(L.label,L.key==='all'?shuffle(L.ids):L.ids,L.conf,L.key)},'↻ Restart'):null,
    h('button',{class:'btn ghost',onclick:home},'Home')));
}

/* ================= start ================= */
load(); initTheme();
$('#homeBtn').addEventListener('click',home);
home();
